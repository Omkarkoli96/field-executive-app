<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Field Executive App</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Loan Recovery Operations</div>
  <h1>Field Executive App</h1>
  <p class="subtitle">Log in with the name and PIN your admin set up for you.</p>

  {% if error %}
    <div class="status show error">{{ error }}</div>
  {% endif %}

  <form action="/login" method="post" autocomplete="off">
    <label for="executive_name">Your name</label>
    <input type="text" id="executive_name" name="executive_name" placeholder="e.g. Ravi Kumar" autocomplete="off" required />

    <label for="pin">PIN</label>
    <input type="password" id="pin" name="pin" inputmode="numeric" pattern="[0-9]*" placeholder="4-8 digit PIN" autocomplete="off" required style="margin-bottom: 16px;" />

    <button type="submit">Log in</button>
  </form>

  <div class="note">
    Don't have a PIN yet? Ask your admin to register you on the Admin page.
  </div>
</div>
</body>
</html>
