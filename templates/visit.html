<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Capture Visit — Field Executive App</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Loan ID {{ loan_id }}</div>
  <h1>Confirm this visit</h1>

  <div class="address-box">
    <div class="label">CUSTOMER ADDRESS</div>
    {{ customer_address }}
  </div>

  <button id="captureBtn" onclick="captureAndVerify()">
    Capture my location &amp; verify visit
  </button>

  <div class="status" id="status"></div>

  <div style="margin-top: 20px;">
    <a class="btn btn-secondary" href="/dashboard?executive={{ executive }}">&larr; Back to my visits</a>
  </div>
</div>

<script>
  function setStatus(kind, html) {
    const el = document.getElementById('status');
    el.className = 'status show ' + kind;
    el.innerHTML = html;
  }

  async function captureAndVerify() {
    if (!('geolocation' in navigator)) {
      setStatus('error', 'This browser does not support location capture.');
      return;
    }
    const btn = document.getElementById('captureBtn');
    btn.disabled = true;
    setStatus('pending', 'Requesting your location — allow access if asked.');

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        try {
          const body = new URLSearchParams();
          body.set('executive_name', {{ executive|tojson }});
          body.set('loan_id', {{ loan_id|tojson }});
          body.set('latitude', latitude);
          body.set('longitude', longitude);
          body.set('accuracy', accuracy);

          const res = await fetch('/api/visit', { method: 'POST', body });
          const data = await res.json();

          if (!data.ok) {
            setStatus('error', data.error || 'Could not save this visit.');
            btn.disabled = false;
            return;
          }

          if (data.status === 'VERIFIED') {
            setStatus('success',
              `<div class="status-big">&#10003; Verified</div>` +
              `<div class="status-row"><span>Distance from customer</span><span>${data.distance_km} km</span></div>`
            );
          } else if (data.status === 'NOT_VERIFIED') {
            setStatus('error',
              `<div class="status-big">Not verified</div>` +
              `<div class="status-row"><span>Distance from customer</span><span>${data.distance_km} km</span></div>` +
              `<div class="status-row"><span></span><span>This is more than 1 km from the registered address.</span></div>`
            );
          } else {
            setStatus('warn',
              `<div class="status-big">Saved — could not confirm</div>` +
              `<div class="status-row"><span></span><span>The customer's address could not be located automatically. This visit was still logged for manual review.</span></div>`
            );
          }

          setTimeout(() => {
            window.location.href = '/dashboard?executive=' + encodeURIComponent({{ executive|tojson }});
          }, 3500);
        } catch (e) {
          setStatus('error', 'Could not reach the server. Try again.');
          btn.disabled = false;
        }
      },
      (err) => {
        btn.disabled = false;
        let msg = 'Could not get your location. ';
        if (err.code === err.PERMISSION_DENIED) {
          msg += 'Location access was denied — check your settings and try again.';
        } else if (err.code === err.POSITION_UNAVAILABLE) {
          msg += 'Position unavailable — try again outdoors or with data/GPS on.';
        } else if (err.code === err.TIMEOUT) {
          msg += 'Request timed out — try again.';
        } else {
          msg += err.message;
        }
        setStatus('error', msg);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>
</body>
</html>
