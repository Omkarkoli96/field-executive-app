<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Log a Visit — Field Executive App</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Logged in as {{ executive }}</div>
  <h1>Log a visit</h1>
  <p class="subtitle">Enter the Loan ID you're visiting. Customer details will fill in automatically.</p>

  <label for="loanId">Loan ID</label>
  <input type="text" id="loanId" placeholder="e.g. LN000001" autocomplete="off" oninput="lookupLoan()" />

  <div class="address-box" id="customerBox" style="display: none;">
    <div class="label">CUSTOMER</div>
    <div id="customerName" style="font-weight: 600; margin-bottom: 6px;"></div>
    <div id="customerAddress"></div>
  </div>

  <div class="status show error" id="lookupStatus" style="display: none;"></div>

  <button id="captureBtn" onclick="captureAndVerify()" disabled style="margin-top: 8px;">
    Capture my location &amp; verify visit
  </button>

  <div class="status" id="status"></div>

  <div class="note">
    Each submission saves automatically to the shared visit log — you can
    log another visit right after by clearing the Loan ID and entering a
    new one.
  </div>
</div>

<script>
  const executive = {{ executive|tojson }};
  let loanFound = false;
  let lookupTimer = null;

  function setStatus(kind, html) {
    const el = document.getElementById('status');
    el.className = 'status show ' + kind;
    el.innerHTML = html;
  }

  function lookupLoan() {
    const loanId = document.getElementById('loanId').value.trim();
    const box = document.getElementById('customerBox');
    const lookupStatus = document.getElementById('lookupStatus');
    const btn = document.getElementById('captureBtn');

    clearTimeout(lookupTimer);
    box.style.display = 'none';
    lookupStatus.style.display = 'none';
    btn.disabled = true;
    loanFound = false;

    if (!loanId) return;

    lookupTimer = setTimeout(async () => {
      try {
        const res = await fetch('/api/loan-lookup?loan_id=' + encodeURIComponent(loanId));
        const data = await res.json();
        if (data.found) {
          document.getElementById('customerName').textContent = data.customer_name || '(no name on file)';
          document.getElementById('customerAddress').textContent = data.customer_address;
          box.style.display = 'block';
          btn.disabled = false;
          loanFound = true;
        } else {
          lookupStatus.style.display = 'block';
          lookupStatus.textContent = 'No customer found for Loan ID "' + loanId + '". Check the ID and try again.';
        }
      } catch (e) {
        lookupStatus.style.display = 'block';
        lookupStatus.textContent = 'Could not check that Loan ID. Check your connection.';
      }
    }, 400);
  }

  async function captureAndVerify() {
    const loanId = document.getElementById('loanId').value.trim();
    if (!loanFound || !loanId) return;

    if (!('geolocation' in navigator)) {
      setStatus('error', 'This browser does not support location capture.');
      return;
    }
    const btn = document.getElementById('captureBtn');
    btn.disabled = true;
    setStatus('pending', 'Requesting your location — allow access if asked.');

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        try {
          const body = new URLSearchParams();
          body.set('executive_name', executive);
          body.set('loan_id', loanId);
          body.set('latitude', latitude);
          body.set('longitude', longitude);
          body.set('accuracy', accuracy);

          const res = await fetch('/api/visit', { method: 'POST', body });
          const data = await res.json();

          if (!data.ok) {
            setStatus('error', data.error || 'Could not save this visit.');
            btn.disabled = false;
            return;
          }

          if (data.status === 'VERIFIED') {
            setStatus('success',
              `<div class="status-big">&#10003; Verified</div>` +
              `<div class="status-row"><span>Distance from customer</span><span>${data.distance_km} km</span></div>`
            );
          } else if (data.status === 'NOT_VERIFIED') {
            setStatus('error',
              `<div class="status-big">Not verified</div>` +
              `<div class="status-row"><span>Distance from customer</span><span>${data.distance_km} km</span></div>`
            );
          } else {
            setStatus('warn',
              `<div class="status-big">Saved — could not confirm</div>` +
              `<div class="status-row"><span></span><span>Customer address could not be located automatically. Logged for manual review.</span></div>`
            );
          }

          document.getElementById('loanId').value = '';
          document.getElementById('customerBox').style.display = 'none';
        } catch (e) {
          setStatus('error', 'Could not reach the server. Try again.');
        }
        btn.disabled = false;
      },
      (err) => {
        btn.disabled = false;
        let msg = 'Could not get your location. ';
        if (err.code === err.PERMISSION_DENIED) {
          msg += 'Location access was denied — check your settings and try again.';
        } else if (err.code === err.POSITION_UNAVAILABLE) {
          msg += 'Position unavailable — try again outdoors or with data/GPS on.';
        } else if (err.code === err.TIMEOUT) {
          msg += 'Request timed out — try again.';
        } else {
          msg += err.message;
        }
        setStatus('error', msg);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }
</script>
</body>
</html>
